<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Word Reels · Arkadaşınla Oyna</title><style>body{margin:0;background:#21191c;color:#f3e6ba;font:18px system-ui;display:grid;min-height:100svh;place-items:center}main{max-width:420px;margin:24px;padding:36px 24px;border:3px solid #c69c55;border-radius:28px;background:linear-gradient(135deg,#8d2423,#501919);text-align:center;box-shadow:0 12px 40px #0006}h1{font-size:32px}a,button{display:block;box-sizing:border-box;width:100%;padding:18px;margin:16px 0;border:2px solid #d7ad64;border-radius:14px;background:#173f3c;color:#fff1cc;font:700 18px system-ui;text-decoration:none}small{display:block;line-height:1.6}#status{min-height:48px}a[hidden],button[hidden]{display:none}</style></head><body><main><small>WORD REELS</small><h1>Arkadaşınla oyna</h1><p id="status">Davet bağlantısı kontrol ediliyor…</p><a id="open" hidden>Oyunda aç</a><button id="copy" hidden>Davet bağlantısını kopyala</button><small>Word Reels cihazında kurulu olmalı. Açılmazsa bağlantıyı oyundaki Arkadaşınla Oyna alanına yapıştır.</small></main><script>
const p=new URLSearchParams(location.hash.slice(1)),t=p.get('invite'),valid=[...p].length===1&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(t||'');
const status=document.getElementById('status'),open=document.getElementById('open'),copy=document.getElementById('copy');
if(valid){status.textContent='Aynı harflerle yarışmaya hazırsın.';open.href='wordreels://invite/'+t.toLowerCase();open.hidden=copy.hidden=false;copy.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);status.textContent='Bağlantı kopyalandı.'}catch{status.textContent='Adres çubuğundaki bağlantıyı kopyalayabilirsin.'}}}else status.textContent='Bu davet bağlantısı geçerli değil. Arkadaşından yeni bir bağlantı iste.';
</script></body></html>
